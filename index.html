<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistemazione Bug</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f4f5f7;
      color: #172b4d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 12px;
    }

    p {
      color: #5e6c84;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    button {
      background-color: #0052cc;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #0065ff;
    }

    .status-text {
      margin-top: 16px;
      font-weight: 600;
      color: #de350b;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Sistemazione Bug</h1>
    <p>Il sito è momentaneamente in manutenzione per la risoluzione di alcuni errori.</p>
    
    <button onclick="avviso()">Controlla stato</button>
    
    <div id="stato" class="status-text"></div>
  </div>

  <script>
    function avviso() {
      alert("Torna più tardi");
      document.getElementById("stato").textContent = "Torna più tardi";
    }
  </script>

</body>
</html>
